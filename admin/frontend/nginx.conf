server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml+rss image/svg+xml;

    # SPA fallback — every unknown path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-term caching for hashed assets.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|gif|webp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse proxy to backend service. The compose service is named "backend".
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static file serving for uploaded blobs.
    location /files/ {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host              $host;
    }

    # Swagger UI.
    location /swagger/ {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host              $host;
    }

    # Mini-program H5 build — sits at admin/frontend/public/showcase-app/
    # Built from uniapp/ via HBuilderX (运行 → 发行 → 网站-PC Web 或手机H5).
    # The showcase page loads this in an iframe.
    location /showcase-app/ {
        alias /usr/share/nginx/html/showcase-app/;
        index index.html;
        try_files $uri $uri/ /showcase-app/index.html;
    }
}