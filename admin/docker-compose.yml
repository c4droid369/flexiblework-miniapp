# syntax=docker/compose-spec
name: admin-template

services:
  mysql:
    image: mysql:8.0
    container_name: admin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-admin_template}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-adminpass}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - admin-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admin-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_HOST: 0.0.0.0
      # Backend listening port — mirrors BACKEND_PORT (the host-mapped port).
      # Change either to change both, e.g. `BACKEND_PORT=8081 docker compose up -d`.
      SERVER_PORT: ${BACKEND_PORT:-8080}
      SERVER_ENV: ${SERVER_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER:-admin}
      DB_PASSWORD: ${MYSQL_PASSWORD:-adminpass}
      DB_NAME: ${MYSQL_DATABASE:-admin_template}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-32-bytes-min}
      JWT_ACCESS_TTL: 2h
      JWT_REFRESH_TTL: 168h
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/storage/uploads
      # File URLs are reconstructed by the backend with this base, so it must
      # track BACKEND_PORT too (browser hits <BACKEND_PORT>/files/... directly).
      STORAGE_BASE_URL: http://localhost:${BACKEND_PORT:-8080}/files
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    # Host port : container port. Both come from BACKEND_PORT so changing one
    # keeps them in sync — admin frontend's nginx proxies to backend:<BACKEND_PORT>.
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    volumes:
      - backend_storage:/app/storage
    networks:
      - admin-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: admin-frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Mirror BACKEND_PORT so the nginx template can proxy_pass to the
    # matching container-side port. The default here MUST match the
    # backend's default (see above) so a no-env launch stays self-consistent.
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    networks:
      - admin-net

volumes:
  mysql_data:
  backend_storage:

networks:
  admin-net:
    driver: bridge